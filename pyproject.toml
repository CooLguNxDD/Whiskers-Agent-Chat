[project]
name = "cat-fleet-chat"
version = "0.1.0"
description = "Shared chat and task board for a fleet of coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "fastmcp>=4.0,<5",
    "httpx>=0.27",
    "sqlalchemy>=2.0,<2.2",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Only the Discord relay (cat-fleet-discord) needs this; the hub itself does not.
discord = [
    "discord.py>=2.4",
]

[project.scripts]
cat-fleet-chat = "run:main"
cat-fleet-listen = "cat_fleet_chat.listen:main"
cat-fleet-discord = "cat_fleet_chat.discord_relay:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run"]
packages = ["cat_fleet_chat"]

[tool.setuptools.package-data]
cat_fleet_chat = ["static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
