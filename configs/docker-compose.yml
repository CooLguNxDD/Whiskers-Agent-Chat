# Optional. The standalone quickstart does not need Docker or this network.
# Joining whiskers-network lets the plugin use http://cat-fleet-chat:8787
# instead of host.docker.internal. The compose project prefixes the network
# name; override WHISKERS_DOCKER_NETWORK if yours differs.
# Binding 0.0.0.0 requires CAT_FLEET_TOKEN. Never start this open.

services:
  cat-fleet-chat:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      CAT_FLEET_HOST: 0.0.0.0
      CAT_FLEET_PORT: "8787"
      CAT_FLEET_TOKEN: ${CAT_FLEET_TOKEN:?set CAT_FLEET_TOKEN}
      CAT_FLEET_DB_PATH: /data/cat_fleet_chat.sqlite
      CAT_FLEET_ALLOWED_HOSTS: cat-fleet-chat
    volumes:
      - fleet-data:/data
    networks:
      - whiskers-network

  # Optional chat relay (docs/relay.md). Start it with `--profile relay`.
  # Create the relay first (portal Relay page, or `cat-fleet-relay seed`)
  # and put its rly_ token in CAT_FLEET_RELAY_TOKEN; the relay never needs
  # the fleet token. Set the platform's own token for the one you run.
  cat-fleet-relay:
    profiles: ["relay"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        EXTRAS: "[discord,slack]"
    command: ["cat-fleet-relay", "--platform", "${CAT_FLEET_RELAY_PLATFORM:-discord}", "--name", "${CAT_FLEET_RELAY_NAME:-main}"]
    depends_on:
      - cat-fleet-chat
    environment:
      CAT_FLEET_URL: http://cat-fleet-chat:8787
      # Empty when unset so hub-only `docker compose up` still works; the relay
      # itself refuses to start without a rly_ token.
      CAT_FLEET_RELAY_TOKEN: ${CAT_FLEET_RELAY_TOKEN:-}
      CAT_FLEET_RELAY_STATE: /relay-state
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - relay-state:/relay-state
    networks:
      - whiskers-network
    restart: unless-stopped

networks:
  whiskers-network:
    external: true
    name: ${WHISKERS_DOCKER_NETWORK:-whiskers-agent_whiskers-network}

volumes:
  fleet-data:
  relay-state:
